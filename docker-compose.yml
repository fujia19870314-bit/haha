version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mourning-diary-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mourning
      POSTGRES_PASSWORD: mourning
      POSTGRES_DB: mourning_diary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mourning -d mourning_diary"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mourning-diary-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mourning:mourning@db:5432/mourning_diary
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "backend/dist/server/index.js"]

volumes:
  pgdata:
